services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/openagents_workspace
      AUTH_MODE: local_password
      LOCAL_MODE: "false"
      WORKSPACE_SESSION_SECRET_FILE: /app/secrets/local-session.key
      FIREBASE_PROJECT_ID: ""
      YUMI_ENABLED: "true"
      YUMI_API_KEY: ${YUMI_API_KEY:-}
      ROUTER_LLM_ENABLED: "false"
      CAMPAIGN_ENABLED: "false"
      FRONTEND_BASE_URL: http://localhost:3000
      PUBLIC_API_BASE: http://localhost:8000
      IDENTITY_MODE: standalone
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_LOCAL_MODE: "false"
        NEXT_PUBLIC_AUTH_MODE: local_password
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
